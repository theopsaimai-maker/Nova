version: "3.9"

services:
  # ─── PostgreSQL with pgvector ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: nova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./web/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache + BullMQ job queue) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nova_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
